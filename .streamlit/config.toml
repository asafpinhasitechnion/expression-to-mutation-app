[server]
headless = true
enableCORS = true
runOnSave = true

[browser]
gatherUsageStats = false

# Theme from the manuscript figure palette (theme.py).
# Green is the primary accent; page is a faint warm off-white; surfaces are white.
[theme]
base = "light"
primaryColor = "#558771"
backgroundColor = "#FBFAF6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2A2620"
font = "sans serif"
